    // ==================== SUGGESTION ====================
    function toggleSuggestion() {
        const box = document.getElementById('suggestionButtons');
        box.style.display = box.style.display === 'none' ? 'flex' : 'none';
    }
    function showBasicStrategyAdvice() {
        if (gameState !== 'PLAYING') return;
        const advice = getBasicStrategyAdvice(playerHands[currentHandIndex], dealerHand[0]);
        showStatus(advice);
        document.getElementById('suggestionButtons').style.display = 'none';
    }
    function showCardCountingAdvice() {
        if (gameState !== 'PLAYING') return;
        const count = calculateRunningCount();
        showStatus(getCardCountingAdvice(count));
        document.getElementById('suggestionButtons').style.display = 'none';
    }
    function getBasicStrategyAdvice(playerHand, dealerUpcard) {
        const code = getOptimalAction(playerHand, dealerUpcard);
        const map = {
            'H': 'طبق استراتژی پایه: Hit',
            'S': 'طبق استراتژی پایه: Stand',
            'D': 'طبق استراتژی پایه: Double',
            'P': 'طبق استراتژی پایه: Split'
        };
        return map[code] || 'طبق استراتژی پایه تصمیم بگیرید.';
    }
    function calculateRunningCount() {
        let count = 0;
        for (let hand of playerHands) for (let card of hand) count += hiLoValue(card);
        if (dealerHand.length > 0) {
            count += hiLoValue(dealerHand[0]);
            if (!dealerCardHidden && dealerHand.length > 1) count += hiLoValue(dealerHand[1]);
        }
        return count;
    }
    function hiLoValue(card) {
        const val = cardValue(card);
        if (val >= 2 && val <= 6) return 1;
        if (val >= 7 && val <= 9) return 0;
        if (val >= 10 || card.val === 'A') return -1;
        return 0;
    }
    function getCardCountingAdvice(count) {
        let msg = "شمارش فعلی: " + (count > 0 ? "+" + count : count) + ". ";
        if (count >= 3) msg += "مزیت با شماست.";
        else if (count >= 1) msg += "شرایط نسبتاً خوب است.";
        else if (count <= -3) msg += "مزیت با دیلر است.";
        else msg += "شرایط خنثی است.";
        return msg;
    }

    // ==================== ACTIONS ====================
    function rechargeBankroll() {
        if (trainingMode) {
            if (confirm('🔄 ریست تمرین\n\nموجودی به ۱۰۰۰$ برمی‌گردد و گزارش نمایش داده می‌شود.\n\nموافقید؟')) {
                if (trainingData.hands.length > 0) showTrainingReport();
                setTimeout(() => {
                    bankroll = pureStrategyMode ? 1000000 : 1000;
                    currentBet = pureStrategyMode ? 100 : 0;
                    trainingData.hands = [];
                    trainingData.decisions = [];
                    trainingData.startBankroll = 1000;
                    trainingData.recharged = false;
                    trainingData.bankrollHistory = [1000];
                    currentStreak = 0;
                    longestStreak = 0;
                    totalFeedbackCorrect = 0;
                    totalFeedbackWrong = 0;
                    handCounter = 0;
                    updateUI();
                    updateTrainingHud();
                    showStatus('تمرین ریست شد.');
                }, 100);
            }
            return;
        }
        if (gameState !== 'BETTING') return showStatus('لطفاً تا پایان دست صبر کنید.');
        bankroll += 10000;
        updateUI();
        showStatus('موجودی شما ۱۰٬۰۰۰ دلار شارژ شد! 💰');
    }
    function addBet(amount) {
        if (gameState !== 'BETTING') return;
        if (pureStrategyMode) return;
        if (bankroll >= amount) {
            bankroll -= amount; currentBet += amount; updateUI();
            showStatus(`شرط فعلی: $${formatNumber(currentBet)}`);
        } else showStatus('موجودی کافی نیست!', false, true);
    }
    function addManualBet() {
        if (gameState !== 'BETTING') return showStatus('در حال حاضر نمی‌توانید شرط ببندید.');
        if (pureStrategyMode) { showStatus('در حالت فقط استراتژی نیازی به شرط نیست.'); return; }
        const input = document.getElementById('manualBetInput');
        const amount = parseFloat(input.value);
        if (isNaN(amount) || amount <= 0) return showStatus('مبلغ معتبر وارد کنید.', false, true);
        if (amount > bankroll) return showStatus('مبلغ وارد شده از موجودی بیشتر است.', false, true);
        bankroll -= amount; currentBet += amount; updateUI();
        showStatus(`شرط فعلی: $${formatNumber(currentBet)}`);
        input.value = '';
    }
    function clearBet() {
        if (gameState !== 'BETTING') return;
        if (currentBet > 0) { bankroll += currentBet; currentBet = 0; updateUI(); showStatus('لطفاً برای شروع شرط‌بندی کنید!'); }
    }

    function createDeck() {
        deck = [];
        for (let suit of suits) for (let val of values) deck.push({ suit, val });
        for (let i = deck.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [deck[i], deck[j]] = [deck[j], deck[i]];
        }
    }

    // ==================== RENDERING ====================
    function renderDealerCards(hideSecondCard = false) {
        dealerCardHidden = hideSecondCard;
        const container = document.getElementById('dealerCards');
        container.innerHTML = '';
        if (!hideSecondCard && isBlackjack(dealerHand)) container.classList.add('blackjack-highlight');
        else container.classList.remove('blackjack-highlight');
        dealerHand.forEach((card, index) => {
            const wrapper = document.createElement('div');
            if (hideSecondCard && index === 1) wrapper.innerHTML = getCardBackHTML();
            else wrapper.innerHTML = getCardHTML(card);
            const cardEl = wrapper.firstElementChild;
            cardEl.style.animationDelay = `${index * 0.12}s`;
            container.appendChild(cardEl);
        });
        updateDealerScore();
    }
    function renderPlayerHands() {
        const container = document.getElementById('playerHandsContainer');
        container.innerHTML = '';
        playerHands.forEach((hand, index) => {
            const handDiv = document.createElement('div');
            handDiv.style.display = 'flex';
            handDiv.style.flexDirection = 'column';
            handDiv.style.alignItems = 'center';
            handDiv.style.gap = '2px';
            if (splitActive && index === currentHandIndex && gameState === 'PLAYING') {
                handDiv.classList.add('active-hand');
                const label = document.createElement('div');
                label.className = 'hand-label'; label.innerText = 'دست فعال';
                handDiv.appendChild(label);
            }
            if (isBlackjack(hand)) handDiv.classList.add('blackjack-highlight');
            const cardsRow = document.createElement('div');
            cardsRow.className = 'cards-row';
            hand.forEach(card => {
                const wrapper = document.createElement('div');
                wrapper.innerHTML = getCardHTML(card);
                cardsRow.appendChild(wrapper.firstElementChild);
            });
            handDiv.appendChild(cardsRow);
            const scoreSpan = document.createElement('span');
            scoreSpan.className = 'score-box'; scoreSpan.innerText = getScoreDisplay(hand);
            handDiv.appendChild(scoreSpan);
            container.appendChild(handDiv);
        });
    }

    // ==================== GAME FLOW ====================
    function startRound() {
        if (gameState !== 'BETTING') return;
        if (!pureStrategyMode && currentBet === 0) return;
        if (pureStrategyMode && currentBet === 0) currentBet = 100;

        if (dealerInterval) { clearInterval(dealerInterval); dealerInterval = null; }

        // در حالت Drill Mode: کارت‌ها را تا رسیدن به شرایط مورد نظر تکرار کن
        let attempts = 0;
        let testPlayerHand, testDealerHand;
        do {
            createDeck();
            testPlayerHand = [deck.pop(), deck.pop()];
            testDealerHand = [deck.pop(), deck.pop()];
            attempts++;
        } while (drillMode !== 'off' && !drillMatchesCondition(testPlayerHand, testDealerHand[0]) && attempts < 200);

        playerHands = [testPlayerHand];
        dealerHand = testDealerHand;

        handCounter++;
        betPerHand = [currentBet]; currentHandIndex = 0;
        splitActive = false; splitAcesActive = false;
        insuranceTaken = false; insuranceBet = 0;
        hasActed = false; canSurrender = true;
        gameState = 'PLAYING';

        if (trainingMode) {
            const betPercent = pureStrategyMode ? 0 : (currentBet / (bankroll + currentBet)) * 100;
            trainingData.currentHandRecord = {
                handNumber: handCounter,
                bankrollBefore: bankroll + currentBet,
                bet: currentBet,
                betPercent: betPercent,
                playerCards: playerHands[0].map(c => c.val + c.suit),
                dealerUpcard: dealerHand[0].val + dealerHand[0].suit,
                actions: [],
                result: null,
                profit: 0,
                splits: 0
            };
        }

        renderDealerCards(true); renderPlayerHands(); updateUI();
        if (dealerHand[0].val === 'A') {
            gameState = 'INSURANCE';
            updateUI();
            showStatus('دیلر آس دارد. آیا بیمه می‌خواهید؟');
            return;
        }
        checkDealerBlackjack();
    }

    function checkDealerBlackjack() {
        const playerHasBJ = isBlackjack(playerHands[0]);
        const dealerHasBJ = isBlackjack(dealerHand);

        if (dealerHasBJ && playerHasBJ) {
            renderDealerCards(false);
            if (!pureStrategyMode) { bankroll += currentBet; if (insuranceTaken) bankroll += insuranceBet * 3; }
            showStatus('هر دو بلک‌جک دارید! مساوی');
            recordTrainingResult('push', 0);
            gameState = 'DEALER_TURN'; updateUI();
            setTimeout(() => resolveRound('push'), 800);
            return;
        }
        if (dealerHasBJ) {
            renderDealerCards(false);
            let insuranceWin = 0;
            if (insuranceTaken && !pureStrategyMode) { insuranceWin = insuranceBet * 3; bankroll += insuranceWin; showStatus('دیلر بلک‌جک دارد. بیمه برد!', true); }
            else showStatus('دیلر بلک‌جک آورد. باختید.', false, true);
            recordTrainingResult('loss', pureStrategyMode ? 0 : (-currentBet + insuranceWin));
            gameState = 'DEALER_TURN'; updateUI();
            setTimeout(() => resolveRound('loss'), 800);
            return;
        }
        if (playerHasBJ) {
            renderDealerCards(false);
            const winAmount = currentBet * 1.5;
            if (!pureStrategyMode) bankroll += currentBet + winAmount;
            showStatus(`بلک‌جک! 🎉`, true);
            recordTrainingResult('win', pureStrategyMode ? 0 : winAmount);
            gameState = 'DEALER_TURN'; updateUI();
            setTimeout(() => resolveRound('win'), 800);
            return;
        }
        if (insuranceTaken) {
            showStatus(`بیمه باخت! ${formatNumber(insuranceBet)}$ از دست رفت.`, false, true);
            insuranceTaken = false; insuranceBet = 0;
        }
        gameState = 'PLAYING'; updateUI();
        showStatus('نوبت شماست.');
    }

    function playerInsurance(choice) {
        if (gameState !== 'INSURANCE') return;
        if (choice) {
            const halfBet = Math.floor(currentBet / 2);
            if (!pureStrategyMode && bankroll < halfBet) return showStatus('موجودی برای بیمه کافی نیست.', false, true);
            if (!pureStrategyMode) bankroll -= halfBet;
            insuranceBet = halfBet; insuranceTaken = true;
            showStatus('بیمه گرفته شد.');
        } else { insuranceTaken = false; insuranceBet = 0; showStatus('بیمه رد شد.'); }
        checkDealerBlackjack();
    }

    function playerSurrender() {
        if (gameState !== 'PLAYING' || !canSurrender || hasActed || splitActive) return;
        if (trainingMode && trainingData.currentHandRecord) {
            trainingData.currentHandRecord.actions.push('تسلیم');
            recordDecision(playerHands[currentHandIndex], dealerHand[0], 'R');
        }
        const halfBet = Math.floor(currentBet / 2);
        if (!pureStrategyMode) bankroll += halfBet;
        showStatus(`تسلیم شدید.`, false, true);
        recordTrainingResult('loss', pureStrategyMode ? 0 : -halfBet);
        currentBet = 0; betPerHand = [];
        gameState = 'BETTING'; splitActive = false; currentHandIndex = 0;
        renderPlayerHands(); renderDealerCards(false); updateUI();
    }

    function playerHit() {
        if (gameState !== 'PLAYING') return;
        if (splitAcesActive) return;
        hasActed = true;
        if (trainingMode && trainingData.currentHandRecord) {
            trainingData.currentHandRecord.actions.push('Hit');
            recordDecision([...playerHands[currentHandIndex]], dealerHand[0], 'H');
        }
        const hand = playerHands[currentHandIndex];
        hand.push(deck.pop()); renderPlayerHands();
        const score = calculateHand(hand);
        if (score > BLACKJACK) {
            if (splitActive && currentHandIndex < playerHands.length - 1) {
                currentHandIndex++; hasActed = false; canSurrender = false;
                updateUI(); renderPlayerHands();
                showStatus(`دست ${currentHandIndex+1} سوخت!`);
            } else {
                if (allHandsBust()) {
                    gameState = 'BETTING';
                    showStatus('همه دست‌ها سوختند!', false, true);
                    recordTrainingResult('loss', pureStrategyMode ? 0 : -(splitActive ? betPerHand.reduce((a,b)=>a+b,0) : currentBet));
                    currentBet = 0; betPerHand = [];
                    splitActive = false; splitAcesActive = false;
                    currentHandIndex = 0; updateUI(); renderDealerCards(false);
                    checkBankrupt();
                    return;
                }
                gameState = 'DEALER_TURN'; updateUI(); renderDealerCards(false);
                showStatus('نوبت دیلر.');
                dealerPlay();
            }
        } else if (score === BLACKJACK) {
            if (splitActive && currentHandIndex < playerHands.length - 1) {
                currentHandIndex++; hasActed = false; canSurrender = false;
                updateUI(); renderPlayerHands();
                showStatus(`نوبت دست ${currentHandIndex+1}`);
            } else dealerPlay();
        } else updateUI();
    }

    function playerStand() {
        if (gameState !== 'PLAYING') return;
        hasActed = true;
        if (trainingMode && trainingData.currentHandRecord) {
            trainingData.currentHandRecord.actions.push('Stand');
            recordDecision([...playerHands[currentHandIndex]], dealerHand[0], 'S');
        }
        if (splitActive) {
            if (currentHandIndex < playerHands.length - 1) {
                currentHandIndex++; hasActed = false; canSurrender = false;
                updateUI(); renderPlayerHands();
                showStatus(`نوبت دست ${currentHandIndex+1}`);
            } else dealerPlay();
        } else dealerPlay();
    }

    function playerDouble() {
        if (gameState !== 'PLAYING') return;
        if (splitAcesActive) return;
        hasActed = true;
        if (trainingMode && trainingData.currentHandRecord) {
            trainingData.currentHandRecord.actions.push('Double');
            recordDecision([...playerHands[currentHandIndex]], dealerHand[0], 'D');
        }
        const hand = playerHands[currentHandIndex];
        if (!splitActive && hand.length !== 2) return;
        if (splitActive && hand.length > 2) return;
        const bet = splitActive ? betPerHand[currentHandIndex] : currentBet;
        if (!pureStrategyMode && bankroll < bet) { showStatus('موجودی برای دوبل کافی نیست.', false, true); return; }
        if (!pureStrategyMode) bankroll -= bet;
        if (splitActive) betPerHand[currentHandIndex] *= 2;
        else currentBet *= 2;
        hand.push(deck.pop()); renderPlayerHands();
        const score = calculateHand(hand);
        if (score > BLACKJACK) {
            if (splitActive && currentHandIndex < playerHands.length - 1) {
                currentHandIndex++; hasActed = false; canSurrender = false;
                updateUI(); renderPlayerHands();
                showStatus(`دست ${currentHandIndex+1} سوخت!`);
            } else {
                if (allHandsBust()) {
                    gameState = 'BETTING';
                    showStatus('همه دست‌ها سوختند!', false, true);
                    recordTrainingResult('loss', pureStrategyMode ? 0 : -(splitActive ? betPerHand.reduce((a,b)=>a+b,0) : currentBet));
                    currentBet = 0; betPerHand = [];
                    splitActive = false; splitAcesActive = false;
                    currentHandIndex = 0; updateUI(); renderDealerCards(false);
                    checkBankrupt();
                    return;
                }
                gameState = 'DEALER_TURN'; updateUI(); renderDealerCards(false);
                showStatus('نوبت دیلر.');
                dealerPlay();
            }
        } else playerStand();
    }

    function playerSplit() {
        if (gameState !== 'PLAYING' || splitActive || playerHands.length !== 1 || playerHands[0].length !== 2 || cardValue(playerHands[0][0]) !== cardValue(playerHands[0][1]) || (!pureStrategyMode && bankroll < currentBet)) return;
        hasActed = true; canSurrender = false;
        if (trainingMode && trainingData.currentHandRecord) {
            trainingData.currentHandRecord.actions.push('Split');
            trainingData.currentHandRecord.splits++;
            recordDecision([...playerHands[0]], dealerHand[0], 'P');
        }
        if (!pureStrategyMode) bankroll -= currentBet;
        betPerHand = [currentBet, currentBet];
        const card1 = playerHands[0][0];
        const card2 = playerHands[0][1];
        playerHands = [[card1], [card2]];
        splitActive = true;
        splitAcesActive = card1.val === 'A' || card2.val === 'A';

        playerHands[0].push(deck.pop());
        playerHands[1].push(deck.pop());

        currentHandIndex = 0;
        hasActed = false;
        renderPlayerHands();

        if (splitAcesActive) {
            showStatus('آس‌ها جدا شدند. نوبت دیلر.');
            updateUI();
            setTimeout(() => dealerPlay(), 700);
        } else {
            showStatus('دست‌ها جدا شدند. نوبت دست اول.');
            updateUI();
        }
    }

    function dealerPlay() {
        gameState = 'DEALER_TURN'; updateUI(); renderDealerCards(false);
        let dealerScore = calculateHand(dealerHand);
        const soft17 = isSoft(dealerHand) && dealerScore === 17;
        if (!soft17 && dealerScore >= DEALER_STAND_THRESHOLD) { finishDealerTurn(); return; }
        if (dealerInterval) clearInterval(dealerInterval);
        dealerInterval = setInterval(() => {
            let currentScore = calculateHand(dealerHand);
            const currentSoft17 = isSoft(dealerHand) && currentScore === 17;
            if (currentScore < DEALER_STAND_THRESHOLD || currentSoft17) {
                dealerHand.push(deck.pop()); renderDealerCards(false);
            } else {
                clearInterval(dealerInterval); dealerInterval = null; finishDealerTurn();
            }
        }, 900);
    }

    function finishDealerTurn() {
        const dScore = calculateHand(dealerHand);
        const bankrollBefore = bankroll;

        if (dScore > BLACKJACK) {
            let totalWin = 0;
            playerHands.forEach((hand, idx) => {
                if (calculateHand(hand) <= BLACKJACK) {
                    const bet = splitActive ? betPerHand[idx] : currentBet;
                    totalWin += bet * 2;
                }
            });
            if (!pureStrategyMode) bankroll += totalWin;
            showStatus(`دیلر سوخت! 🎉`, true);
            recordTrainingResult('win', pureStrategyMode ? 0 : (bankroll - bankrollBefore));
            resolveRound('win');
        } else {
            let totalWin = 0, totalLoss = 0;
            let hasWin = false, hasLoss = false, hasPush = false;
            playerHands.forEach((hand, idx) => {
                const pScore = calculateHand(hand);
                const bet = splitActive ? betPerHand[idx] : currentBet;
                if (pScore > BLACKJACK) { totalLoss += bet; hasLoss = true; }
                else if (pScore > dScore) { totalWin += bet * 2; hasWin = true; }
                else if (pScore === dScore) { totalWin += bet; hasPush = true; }
                else { totalLoss += bet; hasLoss = true; }
            });
            if (!pureStrategyMode) bankroll += totalWin;
            const netProfit = pureStrategyMode ? 0 : (bankroll - bankrollBefore);

            if (hasWin && !hasLoss && !hasPush) { showStatus('شما بردید! 🎉', true); recordTrainingResult('win', netProfit); resolveRound('win'); }
            else if (hasLoss && !hasWin && !hasPush) { showStatus('باختید.', false, true); recordTrainingResult('loss', netProfit); resolveRound('loss'); }
            else if (hasPush && !hasWin && !hasLoss) { showStatus('مساوی (Push).'); recordTrainingResult('push', 0); resolveRound('push'); }
            else { showStatus('نتیجه ترکیبی.'); recordTrainingResult('mixed', netProfit); resolveRound('mixed'); }
        }
    }

    function recordTrainingResult(result, profit) {
        if (!trainingMode || !trainingData.currentHandRecord) return;
        trainingData.currentHandRecord.result = result;
        trainingData.currentHandRecord.profit = profit;
        trainingData.hands.push(trainingData.currentHandRecord);
        trainingData.currentHandRecord = null;
        trainingData.bankrollHistory.push(pureStrategyMode ? 1000 : Math.max(0, bankroll));
        updateTrainingHud();
    }

    function resolveRound(result) {
        currentBet = 0; betPerHand = [];
        splitActive = false; splitAcesActive = false;
        currentHandIndex = 0; hasActed = false; canSurrender = false;
        insuranceTaken = false; insuranceBet = 0;
        gameState = 'BETTING';
        renderPlayerHands(); updateUI();
        checkBankrupt();
    }

    function checkBankrupt() {
        if (trainingMode && !pureStrategyMode && bankroll < 10 && !trainingData.recharged) {
            setTimeout(() => {
                trainingData.recharged = true;
                showTrainingReport(true);
            }, 500);
        }
    }

    // ==================== TRAINING REPORT ====================
    function showTrainingReport(bankrupt = false) {
        if (!trainingMode) { showStatus('ابتدا حالت تمرینی را فعال کنید.'); return; }
        if (trainingData.hands.length === 0) { showStatus('هنوز دستی بازی نکرده‌اید.'); return; }

        const hands = trainingData.hands;
        const decisions = trainingData.decisions;
        const wins = hands.filter(h => h.result === 'win').length;
        const losses = hands.filter(h => h.result === 'loss').length;
        const pushes = hands.filter(h => h.result === 'push').length;
        const totalHands = hands.length;
        const totalProfit = hands.reduce((sum, h) => sum + h.profit, 0);
        const finalBankroll = pureStrategyMode ? trainingData.startBankroll : bankroll;
        const profitPercent = pureStrategyMode ? 0 : ((finalBankroll - trainingData.startBankroll) / trainingData.startBankroll) * 100;

        const correct = decisions.filter(d => d.correct).length;
        const accuracy = decisions.length > 0 ? (correct / decisions.length) * 100 : 0;

        const avgBet = hands.length > 0 ? hands.reduce((s, h) => s + h.bet, 0) / hands.length : 0;
        const avgBetPercent = hands.length > 0 ? hands.reduce((s, h) => s + h.betPercent, 0) / hands.length : 0;
        const maxBetPercent = hands.length > 0 ? Math.max(...hands.map(h => h.betPercent)) : 0;

        const biggestWin = hands.length > 0 ? Math.max(...hands.map(h => h.profit)) : 0;
        const biggestLoss = hands.length > 0 ? Math.min(...hands.map(h => h.profit)) : 0;

        let chasingLosses = 0;
        for (let i = 1; i < hands.length; i++) {
            if (hands[i-1].result === 'loss' && hands[i].bet > hands[i-1].bet * 1.5) chasingLosses++;
        }

        const mistakes = decisions.filter(d => !d.correct);

        // ============ امتیازدهی پیشرفته ============
        const strategyScore = Math.max(0, Math.min(100, accuracy));
        const bankrollScore = pureStrategyMode ? 100 : Math.max(0, Math.min(100,
            50 + (profitPercent > 0 ? Math.min(30, profitPercent) : Math.max(-50, profitPercent)) +
            (avgBetPercent >= 1 && avgBetPercent <= 2.5 ? 20 : avgBetPercent > 5 ? -20 : 0)
        ));
        const disciplineScore = Math.max(0, Math.min(100, 100 - (chasingLosses * 20) - (maxBetPercent > 15 ? 20 : 0)));
        const consistencyScore = Math.max(0, Math.min(100, longestStreak * 5));

        const overallScore = Math.round((strategyScore * 0.4 + bankrollScore * 0.3 + disciplineScore * 0.2 + consistencyScore * 0.1));

        // ============ مدال‌ها ============
        const medals = [
            { icon: '🎓', name: 'استاد استراتژی', earned: strategyScore >= 90, tooltip: 'دقت ≥ ۹۰٪' },
            { icon: '💰', name: 'مدیر سرمایه', earned: bankrollScore >= 80, tooltip: 'مدیریت عالی' },
            { icon: '🛡️', name: 'منضبط', earned: disciplineScore >= 90, tooltip: 'بدون تعقیب ضرر' },
            { icon: '🔥', name: 'سری داغ', earned: longestStreak >= 8, tooltip: '۸+ تصمیم صحیح پشت سرهم' },
            { icon: '🏆', name: 'کامل', earned: accuracy === 100 && totalHands >= 10, tooltip: '۱۰۰٪ دقت' }
        ];

        let verdict, verdictClass;
        if (overallScore >= 80) { verdict = '🏆 عملکرد عالی!'; verdictClass = 'excellent'; }
        else if (overallScore >= 60) { verdict = '👍 عملکرد خوب'; verdictClass = 'good'; }
        else if (overallScore >= 40) { verdict = '⚠️ نیاز به بهبود'; verdictClass = 'average'; }
        else { verdict = '❌ عملکرد ضعیف'; verdictClass = 'poor'; }

        let resultAnalysis = '';
        if (pureStrategyMode) {
            resultAnalysis = `حالت فقط استراتژی: ${correct} تصمیم صحیح از ${decisions.length} (${accuracy.toFixed(1)}٪ دقت)`;
        } else if (totalProfit > 0) {
            resultAnalysis = `سود ${formatNumber(Math.abs(totalProfit))}$ (${profitPercent.toFixed(1)}%+)`;
        } else if (totalProfit === 0) {
            resultAnalysis = `بدون سود/زیان`;
        } else {
            resultAnalysis = `زیان ${formatNumber(Math.abs(totalProfit))}$ (${Math.abs(profitPercent).toFixed(1)}%)`;
        }

        const mistakeGroups = {};
        mistakes.forEach(m => {
            const key = `${m.playerValue}${m.isSoft ? '(نرم)' : ''} vs ${m.dealerUpcard[0]}`;
            if (!mistakeGroups[key]) mistakeGroups[key] = { count: 0, example: m };
            mistakeGroups[key].count++;
        });
        const topMistakes = Object.entries(mistakeGroups).sort((a, b) => b[1].count - a[1].count).slice(0, 5);

        const advices = [];
        if (accuracy < 70) advices.push(`دقت ${accuracy.toFixed(1)}٪ — با جدول استراتژی پایه بیشتر تمرین کنید.`);
        else if (accuracy < 85) advices.push(`دقت ${accuracy.toFixed(1)}٪ — نزدیک به تسلط کامل هستید.`);
        else advices.push(`دقت ${accuracy.toFixed(1)}٪ — عالی!`);

        if (avgBetPercent > 5) advices.push(`میانگین شرط ${avgBetPercent.toFixed(1)}٪ — زیاد است. ۱ تا ۲.۵٪ توصیه می‌شود.`);
        else if (avgBetPercent >= 1 && avgBetPercent <= 2.5) advices.push(`مدیریت سرمایه عالی!`);

        if (chasingLosses > 2) advices.push(`${chasingLosses} بار تعقیب ضرر — خطرناک!`);
        if (longestStreak >= 8) advices.push(`🔥 رکورد سری داغ: ${longestStreak} تصمیم صحیح پشت سرهم!`);

        advices.push(`با موجودی حداقل ۵۰ برابر شرط پایه بازی کنید.`);

        const medalHtml = medals.map(m =>
            `<div class="medal ${m.earned ? 'earned' : ''}" title="${m.tooltip}">
                <div class="medal-icon">${m.icon}</div>
                <div class="medal-name">${m.name}</div>
            </div>`
        ).join('');

        let mistakesHtml = topMistakes.length > 0
            ? topMistakes.map(([key, data]) => {
                const m = data.example;
                return `<li>❌ <b>${key}</b> (${data.count} بار)<br><span style="color:#94a3b8">شما: ${actionName(m.actual)} | صحیح: ${actionName(m.optimal)}</span></li>`;
            }).join('')
            : '<li style="border-right-color:#22c55e">✅ هیچ اشتباهی!</li>';

        const adviceHtml = advices.map(a => `<li>💡 ${a}</li>`).join('');

        const lastHands = hands.slice(-10).reverse();
        const handsHtml = lastHands.map(h => {
            const resultIcon = h.result === 'win' ? '✅' : h.result === 'loss' ? '❌' : h.result === 'push' ? '➖' : '🔀';
            const resultClass = h.result === 'win' ? 'win' : h.result === 'loss' ? 'loss' : 'push';
            const profitStr = (h.profit >= 0 ? '+' : '') + '$' + formatNumber(h.profit);
            return `<div class="hand-history-item ${resultClass}">
                <div class="row"><span>دست ${h.handNumber} ${resultIcon}</span><span>${profitStr}</span></div>
                <div class="row"><span class="label">کارت‌ها:</span><span>${h.playerCards.join(' ')} | دیلر: ${h.dealerUpcard}</span></div>
            </div>`;
        }).join('');

        const reportHtml = `
            <div class="report-header">
                <div class="report-title">📊 گزارش تمرین${pureStrategyMode ? ' (فقط استراتژی)' : ''}</div>
                <button class="report-close" onclick="closeReport()">✕</button>
            </div>

            <div class="verdict ${verdictClass}">${verdict} — امتیاز کل: ${overallScore}/100</div>

            <div class="medals-row">${medalHtml}</div>

            <div class="report-section">
                <div class="report-section-title">🎯 امتیازهای تفکیکی</div>
                <div class="report-grid">
                    <div class="report-item"><span class="label">دقت استراتژی:</span><span class="value ${strategyScore >= 80 ? 'good' : strategyScore >= 60 ? 'warn' : 'bad'}">${strategyScore.toFixed(0)}/100</span></div>
                    <div class="report-item"><span class="label">مدیریت سرمایه:</span><span class="value ${bankrollScore >= 70 ? 'good' : bankrollScore >= 40 ? 'warn' : 'bad'}">${bankrollScore.toFixed(0)}/100</span></div>
                    <div class="report-item"><span class="label">انضباط:</span><span class="value ${disciplineScore >= 80 ? 'good' : disciplineScore >= 60 ? 'warn' : 'bad'}">${disciplineScore.toFixed(0)}/100</span></div>
                    <div class="report-item"><span class="label">پیوستگی:</span><span class="value ${consistencyScore >= 60 ? 'good' : 'warn'}">${consistencyScore.toFixed(0)}/100</span></div>
                </div>
            </div>

            <div class="report-section">
                <div class="report-section-title">📈 خلاصه عملکرد</div>
                <div class="report-grid">
                    <div class="report-item"><span class="label">تعداد دست‌ها:</span><span class="value">${totalHands}</span></div>
                    <div class="report-item"><span class="label">موجودی نهایی:</span><span class="value ${finalBankroll >= trainingData.startBankroll ? 'good' : 'bad'}">${pureStrategyMode ? '♾️' : '$' + formatNumber(Math.max(0, finalBankroll))}</span></div>
                    <div class="report-item"><span class="label">سود/زیان کل:</span><span class="value ${totalProfit >= 0 ? 'good' : 'bad'}">${totalProfit >= 0 ? '+' : ''}$${formatNumber(totalProfit)}</span></div>
                    <div class="report-item"><span class="label">برد/باخت/مساوی:</span><span class="value">${wins}/${losses}/${pushes}</span></div>
                    <div class="report-item"><span class="label">بزرگ‌ترین برد:</span><span class="value good">+$${formatNumber(biggestWin)}</span></div>
                    <div class="report-item"><span class="label">بزرگ‌ترین باخت:</span><span class="value bad">-$${formatNumber(Math.abs(biggestLoss))}</span></div>
                </div>
                <div style="margin-top:8px;font-size:0.72rem;color:#cbd5e1;text-align:center;">${resultAnalysis}</div>
            </div>

            <div class="report-section">
                <div class="report-section-title">📊 نمودار موجودی در طول جلسه</div>
                <div class="chart-container">
                    <canvas id="bankrollChart"></canvas>
                </div>
            </div>

            <div class="report-section">
                <div class="report-section-title">🎯 دقت استراتژی پایه</div>
                <div class="report-grid">
                    <div class="report-item"><span class="label">تعداد تصمیم‌ها:</span><span class="value">${decisions.length}</span></div>
                    <div class="report-item"><span class="label">صحیح:</span><span class="value good">${correct}</span></div>
                    <div class="report-item"><span class="label">نادرست:</span><span class="value bad">${mistakes.length}</span></div>
                    <div class="report-item"><span class="label">دقت:</span><span class="value ${accuracy >= 85 ? 'good' : accuracy >= 70 ? 'warn' : 'bad'}">${accuracy.toFixed(1)}%</span></div>
                    <div class="report-item"><span class="label">طولانی‌ترین سری:</span><span class="value good">${longestStreak}</span></div>
                </div>
            </div>

            ${!pureStrategyMode ? `
            <div class="report-section">
                <div class="report-section-title">💰 مدیریت سرمایه</div>
                <div class="report-grid">
                    <div class="report-item"><span class="label">میانگین شرط:</span><span class="value">$${formatNumber(Math.round(avgBet))}</span></div>
                    <div class="report-item"><span class="label">میانگین %:</span><span class="value ${avgBetPercent >= 1 && avgBetPercent <= 2.5 ? 'good' : avgBetPercent > 5 ? 'bad' : 'warn'}">${avgBetPercent.toFixed(2)}%</span></div>
                    <div class="report-item"><span class="label">بزرگ‌ترین % شرط:</span><span class="value ${maxBetPercent > 15 ? 'bad' : 'good'}">${maxBetPercent.toFixed(2)}%</span></div>
                    <div class="report-item"><span class="label">تعقیب ضرر:</span><span class="value ${chasingLosses > 2 ? 'bad' : 'good'}">${chasingLosses} بار</span></div>
                </div>
            </div>` : ''}

            <div class="report-section">
                <div class="report-section-title">❌ اشتباهات استراتژی</div>
                <ul class="mistakes-list">${mistakesHtml}</ul>
            </div>

            <div class="report-section">
                <div class="report-section-title">💡 پیشنهادات</div>
                <ul class="advice-list">${adviceHtml}</ul>
            </div>

            <div class="report-section">
                <div class="report-section-title">📜 ۱۰ دست آخر</div>
                ${handsHtml}
            </div>

            <button class="btn-export" onclick="exportSession()">📥 دانلود گزارش JSON</button>
            <button class="btn-restart" onclick="closeReport()">بستن گزارش</button>
        `;

        document.getElementById('reportContent').innerHTML = reportHtml;
        document.getElementById('reportModal').classList.add('show');

        setTimeout(() => drawBankrollChart(), 100);
    }

    // ==================== CHART ====================
    function drawBankrollChart() {
        const canvas = document.getElementById('bankrollChart');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);

        const data = trainingData.bankrollHistory;
        if (data.length < 2) {
            ctx.fillStyle = '#94a3b8';
            ctx.font = '12px Tahoma';
            ctx.textAlign = 'center';
            ctx.fillText('داده کافی برای نمودار وجود ندارد', rect.width / 2, rect.height / 2);
            return;
        }

        const w = rect.width;
        const h = rect.height;
        const padding = 20;
        const chartW = w - padding * 2;
        const chartH = h - padding * 2;

        const min = Math.min(...data);
        const max = Math.max(...data);
        const range = max - min || 1;

        // Grid
        ctx.strokeStyle = 'rgba(197,155,39,0.15)';
        ctx.lineWidth = 1;
        for (let i = 0; i <= 4; i++) {
            const y = padding + (chartH / 4) * i;
            ctx.beginPath();
            ctx.moveTo(padding, y);
            ctx.lineTo(w - padding, y);
            ctx.stroke();
        }

        // Line
        ctx.strokeStyle = '#22c55e';
        ctx.lineWidth = 2;
        ctx.beginPath();
        data.forEach((v, i) => {
            const x = padding + (chartW / (data.length - 1)) * i;
            const y = padding + chartH - ((v - min) / range) * chartH;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        });
        ctx.stroke();

        // Area fill
        ctx.lineTo(padding + chartW, padding + chartH);
        ctx.lineTo(padding, padding + chartH);
        ctx.closePath();
        const grad = ctx.createLinearGradient(0, padding, 0, padding + chartH);
        grad.addColorStop(0, 'rgba(34,197,94,0.3)');
        grad.addColorStop(1, 'rgba(34,197,94,0)');
        ctx.fillStyle = grad;
        ctx.fill();

        // Points
        ctx.fillStyle = '#4ade80';
        data.forEach((v, i) => {
            const x = padding + (chartW / (data.length - 1)) * i;
            const y = padding + chartH - ((v - min) / range) * chartH;
            ctx.beginPath();
            ctx.arc(x, y, 2, 0, Math.PI * 2);
            ctx.fill();
        });

        // Start line (original bankroll)
        const startY = padding + chartH - ((trainingData.startBankroll - min) / range) * chartH;
        ctx.strokeStyle = 'rgba(251,191,36,0.6)';
        ctx.setLineDash([5, 3]);
        ctx.beginPath();
        ctx.moveTo(padding, startY);
        ctx.lineTo(w - padding, startY);
        ctx.stroke();
        ctx.setLineDash([]);
    }

    // ==================== EXPORT ====================
    function exportSession() {
        const session = {
            timestamp: new Date().toISOString(),
            startBankroll: trainingData.startBankroll,
            finalBankroll: bankroll,
            totalHands: trainingData.hands.length,
            totalDecisions: trainingData.decisions.length,
            accuracy: trainingData.decisions.length > 0
                ? (trainingData.decisions.filter(d => d.correct).length / trainingData.decisions.length * 100).toFixed(1) + '%'
                : '0%',
            longestStreak: longestStreak,
            drillMode: drillMode,
            pureStrategyMode: pureStrategyMode,
            hands: trainingData.hands,
            decisions: trainingData.decisions
        };

        const blob = new Blob([JSON.stringify(session, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `blackjack-session-${Date.now()}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showStatus('گزارش JSON دانلود شد. 📥');
    }

    function closeReport() {
        document.getElementById('reportModal').classList.remove('show');
    }

    // ==================== INIT ====================
    loadBankroll();
    makeHudDraggable();
    updateUI();
